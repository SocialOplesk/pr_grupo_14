<!DOCTYPE html>
<html lang="es">
<head>
    <style>
        .contenedor {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50;
        }

        .estrella {
            fill: #f1c40f; /* Color de la estrella */
            stroke: #f39c12; /* Color del borde */
            stroke-width: 5;
            transition: transform 0.3s ease;
        }

        .estrella:hover {
            transform: scale(1.2) rotate(15deg);
            fill: #ffec19;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <svg height="200" width="200" viewBox="0 0 200 200">
            <polygon class="estrella" points="100,10 40,198 190,78 10,78 160,198" />
        </svg>
    </div>

</body>
</html>
